<!doctype html>
<!-- Source of public/og-image.png. Regenerate with:
     npm run og -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "WL Display"; src: url("../../public/fonts/WritersLogic-Display.woff2") format("woff2"); }
  @font-face { font-family: "DM Sans"; src: url("../../public/fonts/dm-sans-variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "JB Mono"; src: url("../../public/fonts/jetbrains-mono-regular.woff2") format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    background:
      radial-gradient(ellipse 70% 80% at 85% 20%, rgba(58, 158, 142, 0.20) 0%, transparent 70%),
      radial-gradient(ellipse 60% 70% at 0% 100%, rgba(201, 152, 60, 0.10) 0%, transparent 70%),
      #0A0C07;
    color: #F2EFE6;
    font-family: "DM Sans", sans-serif;
    display: flex;
    align-items: center;
    box-sizing: border-box;
    padding: 0 80px;
    gap: 64px;
  }
  img { width: 300px; height: 300px; flex: none; }
  .eyebrow { font-family: "JB Mono", monospace; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; color: #5FC2B1; margin: 0 0 18px; }
  h1 { font-family: "WL Display", serif; font-weight: 600; font-size: 66px; line-height: 1.04; margin: 0 0 26px; }
  p { font-size: 30px; line-height: 1.35; color: #CFCABD; margin: 0 0 30px; max-width: 640px; }
  .meta { font-family: "JB Mono", monospace; font-size: 20px; color: #A9A495; }
</style>
</head>
<body>
  <img src="/images/crystal-halo/crystal-detailed-static.svg" alt="" />
  <div>
    <p class="eyebrow">WritersLogic</p>
    <h1>Holographic Memory</h1>
    <p>Local, encrypted, provenance-aware memory for AI agents.</p>
    <div class="meta">Open source · Rust · github.com/writerslogic/holographic-memory</div>
  </div>

</body>
</html>
